services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: academico
      POSTGRES_USER: academico
      POSTGRES_PASSWORD: academico
    volumes:
      - datos_academicos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academico"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    # Da margen al cierre de Spring, configurado con 20 segundos por fase.
    stop_grace_period: 30s
    # El puerto del anfitrión se puede cambiar con APP_PORT si el 8080 ya está ocupado.
    ports: ["${APP_PORT:-8080}:8080"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/academico
      DB_USER: academico
      DB_PASSWORD: academico
      # Reto U12: SQL_LOG=DEBUG muestra cada SELECT y permite ver los aciertos de caché.
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: ${SQL_LOG:-INFO}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  datos_academicos:
